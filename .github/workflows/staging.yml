name: Staging
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    name: Integration Tests + Perf Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build binary
        run: make build

      - name: Cache LogHub datasets
        uses: actions/cache@v4
        id: cache-datasets
        with:
          path: testdata/
          key: loghub-hdfs-v1-${{ hashFiles('scripts/download-datasets.sh') }}

      - name: Download real LogHub datasets
        if: steps.cache-datasets.outputs.cache-hit != 'true'
        run: bash scripts/download-datasets.sh

      - name: Run integration tests against real HDFS data
        run: go test -tags integration ./integration/... -v -timeout 120s

      - name: Performance gate — HDFS 2k sample
        run: |
          echo "## Performance Gate" >> $GITHUB_STEP_SUMMARY
          OUTPUT=$(./logdiff bench testdata/HDFS_2k.log 2>&1)
          echo "$OUTPUT"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          LPS=$(echo "$OUTPUT" | grep -oP '[0-9]+(?=\s+lines/sec)' | head -1)
          if [ -n "$LPS" ] && [ "$LPS" -lt 10000 ]; then
            echo "❌ Performance gate failed: ${LPS} lines/sec < 10,000 lines/sec minimum"
            exit 1
          fi
          echo "✅ Throughput: ${LPS} lines/sec"

      - name: Diff same file — expect zero regressions
        run: |
          ./logdiff diff testdata/HDFS_2k.log testdata/HDFS_2k.log && \
            echo "✅ Zero regressions on same-file diff" || \
            echo "⚠️  Unexpected regressions on same-file diff"
          echo "" >> $GITHUB_STEP_SUMMARY
