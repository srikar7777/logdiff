linters-settings:
  govet:
    check-shadowing: true
  staticcheck:
    go: "1.22"
  gofmt:
    simplify: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - gocritic
  disable:
    - depguard

issues:
  exclude-rules:
    # Test files: relax errcheck
    - path: "_test\\.go"
      linters: [errcheck]
    # CLI main: relax errcheck on cobra helpers
    - path: "internal/cli"
      linters: [errcheck]

run:
  go: "1.22"
  timeout: 5m
