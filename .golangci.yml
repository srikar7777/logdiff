linters-settings:
  govet:
    enable:
      - shadow
  gofmt:
    simplify: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - gocritic
  disable:
    - depguard

issues:
  exclude-rules:
    # Test files: relax errcheck
    - path: "_test\\.go"
      linters: [errcheck]
    # CLI layer: relax errcheck on cobra/color helpers
    - path: "internal/cli"
      linters: [errcheck]

run:
  go: "1.22"
  timeout: 5m
